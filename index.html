<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lotte B2B Admin</title>
    
    <!-- CẤU HÌNH PWA & IOS ĐỂ LƯU RA MÀN HÌNH CHÍNH -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lotte B2B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Lotte B2B">
    
    <!-- Icon Lotte Mart -->
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Lotte_Mart_logo.svg/512px-Lotte_Mart_logo.svg.png">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Lotte_Mart_logo.svg/512px-Lotte_Mart_logo.svg.png">

    <style>
        /* Reset toàn bộ viền và thanh cuộn của trang chứa */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Ngăn scroll 2 lớp gây khó chịu trên điện thoại */
            background-color: #F5F5F7;
        }
        
        /* Iframe giãn đầy 100% màn hình */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 
      Khung Iframe gọi trực tiếp luồng Admin từ Google Apps Script.
      *Lưu ý: Nếu link URL Web App thực tế của bạn khác với link bên dưới, hãy thay thế nó, nhớ giữ nguyên hậu tố "?app=admin"
    -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbxYl6BARU3jGNdTrdRMTi1P0WKno-tXUDaLMk0z6anMWSrzEfX6ygw0p_S-HzD0fgwU/exec?app=admin" 
        allow="camera; microphone; geolocation" 
        allowfullscreen>
    </iframe>
</body>
</html>
